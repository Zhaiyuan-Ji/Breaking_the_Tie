project_title: "Breaking the Tie: A Cluster-Aware Routing Framework for Large Language Models"
method_name: "CASLR"
seed: 42
device: "auto"

data:
  files:
    - "data/sample/sample_router_data.csv"
  question_column: "question"
  dataset_column: "dataset"
  router_prefix: "router_"
  test_size: 0.2

experts:
  - "Qwen2.5-7B-Instruct"
  - "Qwen2.5-Coder-7B-Instruct"
  - "Qwen2.5-Math-7B-Instruct"
  - "DeepSeek-R1-Distill-Llama-8B"
  - "DeepSeek-R1-Distill-Qwen-14B"

embedding:
  provider: "deterministic"
  model_name_or_path: "BAAI/bge-large-en-v1.5"
  batch_size: 32
  cache_dir: "outputs/cache/embeddings"
  normalize: true

clustering:
  n_clusters: "auto"
  max_clusters: 20
  min_clusters: 3
  cache_dir: "outputs/cache/clusters"

router:
  base_model_name_or_path: "bert-base-uncased"
  output_dir: "outputs/router"
  max_length: 512
  learning_rate: 0.00004
  epochs: 10
  per_device_batch_size: 32
  gradient_accumulation_steps: 1
  bf16: false

outputs:
  root: "outputs"
  prepared_dir: "outputs/prepared"
  results_dir: "outputs/results"
